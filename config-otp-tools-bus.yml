graphhopper:

  datareader.file: ""
  graph.location: graph-cache
  custom_models.directory: custom_models_fr_ch

  # Keep geocoding behavior from otp-tools config
  services:
    - geocoding
  geocoding:
    enabled: true
    datareader_file: "/home/epascal/Projects/chtrafic/genevois.osm.pbf"

  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]

    - name: car_avoid_toll
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car_avoid_toll.json]

    - name: foot
      custom_model_files: [foot_local.json, foot_elevation_local.json]

    - name: eco
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [eco_model.json]

    - name: bus
      turn_costs:
        vehicle_types: [bus, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [flowride_bus.json]

  profiles_ch:
    - profile: car
    - profile: car_avoid_toll
    - profile: foot
    - profile: eco
    - profile: bus

  profiles_lm: []

  # Merge otp-tools + bus-related encoded values
  graph.encoded_values: car_access,car_average_speed,foot_access,country,hike_rating,foot_priority,foot_average_speed,average_slope,bike_priority,bike_access,roundabout,bike_average_speed,racingbike_priority,racingbike_access,racingbike_average_speed,mtb_priority,mtb_access,mtb_average_speed,mtb_rating,road_access,road_class,road_environment,surface,curvature,max_speed,bus_access,bus_lane_hint,max_weight,max_width,max_height,ferry_speed

  prepare.ch.threads: 8
  graph.elevation.provider: srtm
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.non_ch.max_waypoint_distance: 1000000
  import.osm.ignored_highways: cycleway
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0

logging:
  appenders:
    - type: file
      time_zone: UTC
      current_log_filename: logs/graphhopper.log
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      archive: true
      archived_log_filename_pattern: ./logs/graphhopper-%d.log.gz
      archived_file_count: 30
      never_block: true
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  loggers:
    "com.graphhopper.osm_warnings":
      level: DEBUG
      additive: false
      appenders:
        - type: file
          currentLogFilename: logs/osm_warnings.log
          archive: false
          logFormat: "[%level] %msg%n"
