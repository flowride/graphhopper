version: "3.8"

services:
  graphhopper-import:
    image: ghcr.io/flowride/graphhopper:tomtom_trafic
    entrypoint: /bin/bash
    command: >-
      -lc "rm -rf /data/france-switzerland-gh && java
      -Ddw.graphhopper.datareader.file=/data/france-switzerland.osm.pbf
      -Ddw.graphhopper.graph.location=/data/france-switzerland-gh
      -Ddw.graphhopper.custom_models.directory=/appcfg/custom_models_fr_ch
      -Ddw.graphhopper.geocoding.datareader_file=/data/france-switzerland.osm.pbf
      -Ddw.server.application_connectors[0].bind_host=0.0.0.0
      -Xmx24g -Xms24g
      -jar /opt/graphhopper/graphhopper-web.jar
      import /appcfg/config-otp-tools-bus.yml"
    volumes:
      # Same layout used by otp-tools/scripts/graphhopper/buildgraphhopper.sh
      - type: bind
        source: /home/epascal/Projects/otp-tools/fr-ch/graphhopper
        target: /data
      - type: bind
        source: /home/epascal/Projects/otp-tools/fr-ch/france-switzerland.osm.pbf
        target: /data/france-switzerland.osm.pbf
        read_only: true
      - type: bind
        source: /home/epascal/Projects/graphhopper
        target: /appcfg
        read_only: true
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  graphhopper-serve:
    image: ghcr.io/flowride/graphhopper:tomtom_trafic
    entrypoint: /bin/bash
    command: >-
      -lc "java
      -Ddw.graphhopper.datareader.file=/data/france-switzerland.osm.pbf
      -Ddw.graphhopper.graph.location=/data/france-switzerland-gh
      -Ddw.graphhopper.custom_models.directory=/appcfg/custom_models_fr_ch
      -Ddw.graphhopper.geocoding.datareader_file=/data/france-switzerland.osm.pbf
      -Ddw.server.application_connectors[0].bind_host=0.0.0.0
      -Ddw.server.admin_connectors[0].bind_host=0.0.0.0
      -Xmx24g -Xms24g
      -jar /opt/graphhopper/graphhopper-web.jar
      server /appcfg/config-otp-tools-bus.yml"
    volumes:
      - type: bind
        source: /home/epascal/Projects/otp-tools/fr-ch/graphhopper
        target: /data
      - type: bind
        source: /home/epascal/Projects/otp-tools/fr-ch/france-switzerland.osm.pbf
        target: /data/france-switzerland.osm.pbf
        read_only: true
      - type: bind
        source: /home/epascal/Projects/graphhopper
        target: /appcfg
        read_only: true
    ports:
      - "8989:8989"
      - "8990:8990"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
